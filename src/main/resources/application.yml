server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kmovie
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kmovie}
    username: ${DATABASE_USERNAME:kmovie}
    password: ${DATABASE_PASSWORD:kmovie}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5GB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:5GB}

# ---- Custom app config ----
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-prod-change-this-secret-in-prod}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
    stay-logged-in-expiration-days: ${JWT_STAY_LOGGED_IN_EXPIRATION_DAYS:90}
    issuer: ${JWT_ISSUER:kmovie}

  aws:
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:kmovie-media}
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:false}

  mail:
    from: ${MAIL_FROM:no-reply@kmovie.local}
    # SMTP settings are read by the external message-dispatch worker, kept here for reference/consistency
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}

  sms:
    provider: ${SMS_PROVIDER:africastalking} # africastalking | twilio
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    africastalking:
      username: ${AT_USERNAME:}
      api-key: ${AT_API_KEY:}
      sender-id: ${AT_SENDER_ID:}

  otp:
    length: ${OTP_LENGTH:6}
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:15}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.kmovie: ${LOG_LEVEL:INFO}
